<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flores | Cloud Computing (Firebase)</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">
    <a class="btn-volver" href="../index.html">&larr; Volver</a>
    <div class="header">
        <div class="logo-placeholder">
            <img src="../img/logo.png" alt="Logo">
        </div>
        <div class="title-block">
            <p class="eyebrow">Instituto Profesional Santo Tomás</p>
            <h1>Cloud Computing</h1>
        </div>
    </div>

    <div class="cards">
        <div class="card extendida">
            <h2>Registro de Flores · Firebase</h2>
            <form id="formDatos" class="form-datos">
                <input type="text" id="nombre" placeholder="Nombre" required>
                <input type="text" id="color" placeholder="Color" required>
                <input type="text" id="temporada" placeholder="Temporada" required>
                <input type="number" id="precio" placeholder="Precio" required>
                <input type="number" id="stock" placeholder="Stock" required>
                <button type="submit">Agregar</button>
                <button type="button" id="btnCancelarEdicion" class="btn-limpiar" hidden>Cancelar edición</button>
            </form>

            <div class="tabla-scroll">
            <table id="tablaDatos" class="tabla-datos">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Color</th>
                        <th>Temporada</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>

            <button id="btnLimpiar" class="btn-limpiar">Limpiar todo</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    onValue,
    push,
    set,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDXu3g35qAowLLFpL7g2gLY1-9ACTjOQ0w",
    authDomain: "nube-4b69e.firebaseapp.com",
    databaseURL: "https://nube-4b69e-default-rtdb.firebaseio.com",
    projectId: "nube-4b69e",
    storageBucket: "nube-4b69e.firebasestorage.app",
    messagingSenderId: "537501007530",
    appId: "1:537501007530:web:6a5b07b33da090afe39ad3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const coleccion = ref(db, "flores");

const tablaBody = document.querySelector("#tablaDatos tbody");
const form = document.querySelector("#formDatos");
const btnCancelar = document.querySelector("#btnCancelarEdicion");
let editandoId = null;

function salirDeEdicion() {
    editandoId = null;
    btnCancelar.hidden = true;
    form.querySelector("button[type=submit]").textContent = "Agregar";
    form.reset();
}

function obtenerDatosForm() {
    return {
        nombre: form.nombre.value.trim(),
        color: form.color.value.trim(),
        temporada: form.temporada.value.trim(),
        precio: form.precio.value.trim(),
        stock: form.stock.value.trim()
    };
}

function render(registros) {
    tablaBody.innerHTML = "";
    registros.forEach(([id, item]) => {

        const fila = document.createElement("tr");
        const celdas = [item.nombre, item.color, item.temporada, item.precio, item.stock];
        celdas.forEach((texto) => {
            const td = document.createElement("td");
            td.textContent = texto;
            fila.appendChild(td);
        });

        const celdaAccion = document.createElement("td");

        const btnEditar = document.createElement("button");
        btnEditar.type = "button";
        btnEditar.className = "btn-editar";
        btnEditar.textContent = "Editar";
        btnEditar.onclick = () => {
            editandoId = id;
            btnCancelar.hidden = false;
            form.querySelector("button[type=submit]").textContent = "Guardar";
            form.nombre.value = item.nombre;
            form.color.value = item.color;
            form.temporada.value = item.temporada;
            form.precio.value = item.precio;
            form.stock.value = item.stock;
            form.scrollIntoView({ behavior: "smooth" });
        };

        const btnBorrar = document.createElement("button");
        btnBorrar.type = "button";
        btnBorrar.className = "btn-borrar";
        btnBorrar.textContent = "Borrar";
        btnBorrar.onclick = async () => {
            await remove(ref(db, `flores/${id}`));
            salirDeEdicion();
        };

        celdaAccion.appendChild(btnEditar);
        celdaAccion.appendChild(btnBorrar);
        fila.appendChild(celdaAccion);
        tablaBody.appendChild(fila);
    });
}

function escucharDatos() {
    onValue(coleccion, (snapshot) => {
        const datos = snapshot.val() || {};
        render(Object.entries(datos));
    }, (error) => {
        console.error("Error al escuchar Realtime Database:", error);
    });
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nuevo = obtenerDatosForm();
    if (Object.values(nuevo).some((v) => !v)) return;

    if (editandoId) {
        await update(ref(db, `flores/${editandoId}`), nuevo);
    } else {
        await set(push(coleccion), nuevo);
    }
    salirDeEdicion();
});

btnCancelar.addEventListener("click", salirDeEdicion);

document.querySelector("#btnLimpiar").addEventListener("click", async () => {
    await remove(coleccion);
    salirDeEdicion();
});

escucharDatos();
</script>

</body>
</html>
